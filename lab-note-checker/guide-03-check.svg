<title id="t">3단계 데이터 품질 점검</title><desc id="d">결측치 단위 불일치 이상치 점검 카드 화면</desc>
<rect width="800" height="500" fill="#edf2ef"/><rect x="30" y="26" width="740" height="448" rx="18" fill="#fff" stroke="#cbd7d2"/><rect x="30" y="26" width="740" height="58" rx="18" fill="#123b36"/><rect x="30" y="68" width="740" height="16" fill="#123b36"/><text x="65" y="62" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700">실험 노트 점검기</text>
<g font-family="sans-serif"><text x="65" y="124" fill="#73827d" font-size="13" font-weight="700">1 입력</text><text x="137" y="124" fill="#73827d" font-size="13" font-weight="700">2 표 확인</text><text x="239" y="124" fill="#0f766e" font-size="13" font-weight="800">3 점검</text><rect x="292" y="107" width="23" height="19" rx="10" fill="#b42318"/><text x="303" y="121" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">6</text><text x="336" y="124" fill="#73827d" font-size="13" font-weight="700">4 통계</text><line x1="64" y1="139" x2="735" y2="139" stroke="#d9e1de"/>
<g><rect x="65" y="159" width="150" height="67" rx="11" fill="#fff" stroke="#d7e0dc"/><text x="83" y="183" fill="#b42318" font-size="21" font-weight="900">6</text><text x="83" y="207" fill="#677872" font-size="11">확인 안 한 항목</text><rect x="227" y="159" width="150" height="67" rx="11" fill="#fff" stroke="#d7e0dc"/><text x="245" y="183" fill="#b42318" font-size="21" font-weight="900">2</text><text x="245" y="207" fill="#677872" font-size="11">결측·숫자 아님</text><rect x="389" y="159" width="150" height="67" rx="11" fill="#fff" stroke="#d7e0dc"/><text x="407" y="183" fill="#a15c07" font-size="21" font-weight="900">3</text><text x="407" y="207" fill="#677872" font-size="11">이상치·자릿수</text><rect x="551" y="159" width="184" height="67" rx="11" fill="#fff" stroke="#d7e0dc"/><text x="569" y="183" fill="#a15c07" font-size="21" font-weight="900">1</text><text x="569" y="207" fill="#677872" font-size="11">단위 불일치</text></g>
<rect x="65" y="248" width="670" height="80" rx="10" fill="#fff" stroke="#d3deda" stroke-width="1.2"/><rect x="65" y="248" width="5" height="80" rx="3" fill="#b42318"/><rect x="82" y="264" width="42" height="20" rx="5" fill="#fde8e6"/><text x="103" y="278" text-anchor="middle" fill="#b42318" font-size="10" font-weight="800">결측</text><text x="134" y="279" fill="#1c2a27" font-size="13" font-weight="800">G-10 · 표면 도금 두께 — 출력 값이 비어 있음</text><text x="83" y="305" fill="#677872" font-size="11">원자료에서 찾아 채우거나, 측정하지 않았다면 그대로 둔다고 표시하세요.</text><rect x="594" y="288" width="124" height="26" rx="6" fill="#fff" stroke="#b9c7c1"/><text x="656" y="306" text-anchor="middle" fill="#40534d" font-size="10" font-weight="800">표에서 고치기</text>
<rect x="65" y="341" width="670" height="91" rx="10" fill="#fff" stroke="#d3deda" stroke-width="1.2"/><rect x="65" y="341" width="5" height="91" rx="3" fill="#a15c07"/><rect x="82" y="357" width="66" height="20" rx="5" fill="#fdf1d8"/><text x="115" y="371" text-anchor="middle" fill="#a15c07" font-size="10" font-weight="800">단위 불일치</text><text x="158" y="372" fill="#1c2a27" font-size="13" font-weight="800">G-11 · 도금 두께 — 8900 nm</text><text x="83" y="398" fill="#677872" font-size="11">열 단위(μm)와 다른 단위입니다. 환산 전에는 통계에서 자동 제외됩니다.</text><rect x="514" y="392" width="204" height="27" rx="6" fill="#0f766e"/><text x="616" y="410" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">환산해서 고치기 · 8.9 μm</text></g>
